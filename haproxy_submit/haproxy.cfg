global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms

frontend http-frontend
    bind *:8080
    mode http
    acl is_example_local hdr(host) -i example.local
    use_backend weighted-servers if is_example_local
    default_backend no-match

backend weighted-servers
    mode http
    balance roundrobin
    server server1 127.0.0.1:8001 check weight 2
    server server2 127.0.0.1:8002 check weight 3
    server server3 127.0.0.1:8003 check weight 4

backend no-match
    mode http
    http-request deny deny_status 403

listen stats
    bind *:8081
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats auth admin:admin
